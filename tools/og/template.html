<!DOCTYPE html>
<html lang="{{LANG}}" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>creatioo | {{LABEL}}</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=block">
<style>
/* Same tokens and type as the site (css/home.css) */
:root{--bg:#f3f1ec;--ink:#131312;--mut:#57554f;--line:rgba(19,19,18,.12);--dot:rgba(19,19,18,.16);--brand:#7440d6}
[data-theme=dark]{--bg:#0e0e0d;--ink:#f2f0eb;--mut:#a3a199;--line:rgba(242,240,235,.12);--dot:rgba(242,240,235,.14);--brand:#a06cf8}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font:400 20px/1.5 Geist,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;padding:52px 64px 44px;display:flex;flex-direction:column}
.head,.tail{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:32px}
.logo{display:block;height:34px;width:auto}
.mono{font:500 15px/1 "Geist Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.content{position:relative;flex:1;display:flex;align-items:flex-end;padding-bottom:44px}
.copy{position:relative;z-index:2}
h1{font:600 116px/.88 "Bricolage Grotesque",sans-serif;letter-spacing:-.055em;margin-left:-.04em}
h1 span{display:block;white-space:nowrap;padding-bottom:.04em}
h1 .accent{color:var(--brand)}
.subtitle{margin-top:26px;font-size:25px;line-height:1.35;color:var(--mut)}
.tail{padding-top:22px;border-top:1px solid var(--line);font-size:18px;color:var(--mut)}
.domain{font:500 16px/1 "Geist Mono",monospace;letter-spacing:.02em;color:var(--ink)}

/* Visuals on the right */
.visual{position:absolute;z-index:1}
.dots{position:absolute;z-index:0;inset:0 -64px 0 auto;width:620px;background:radial-gradient(circle,var(--dot) 1.3px,transparent 1.8px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent)}
.mark{fill:var(--brand);overflow:visible}
.home-card .visual{right:-118px;top:-10px;width:560px}
.home-card .mark{display:block;width:100%;height:auto}
.gallery-card .visual{right:0;top:0;bottom:44px;width:416px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.gallery-card .visual img{display:block;width:100%;height:100%;min-height:0;object-fit:cover;border-radius:14px}
.document-card .visual{right:-4px;top:58px;width:270px}
.document-card .mark{display:block;width:100%;height:auto}
.error-card .visual{right:-6px;bottom:118px;display:flex;align-items:baseline;font:600 236px/.8 "Bricolage Grotesque",sans-serif;letter-spacing:-.06em}
.error-card .visual .mark{flex:none;height:.662em;width:auto;margin-inline:.03em .07em}
</style>
</head>
<body>
<article class="card {{LAYOUT}}-card">
  <header class="head"><img class="logo" src="../../assets/images/{{LOGO}}" alt="creatioo"><span class="mono">{{LABEL}}</span></header>
  <main class="content">
    {{VISUAL}}
    <div class="copy"><h1>{{HEADLINE}}</h1><p class="subtitle">{{SUBTITLE}}</p></div>
  </main>
  <footer class="tail"><span>{{FOOTER}}</span><span class="domain">creatioo.pl{{DOMAIN_SUFFIX}}</span></footer>
</article>
</body>
</html>
